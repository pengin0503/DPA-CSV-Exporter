name: One-time import of verified DPA CSV Exporter build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-existing-build.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download published build artifact from public source repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dpa-import"
          gh run download 40447166070 \
            --repo pengin0503/RimWorld-for-mod-test \
            --name DPA-CSV-Exporter-1.0.0-RW1.7 \
            --dir "$RUNNER_TEMP/dpa-import"
          file="$RUNNER_TEMP/dpa-import/DPA-CSV-Exporter-1.0.0-RW1.7.zip"
          echo "a02272ff0e7e321014607a088c2f515ba6ada9b2277965f920082fa6fdeb225e  $file" | sha256sum -c -
          unzip -t "$file"
          mkdir -p dist 1.7/Assemblies
          cp "$file" dist/
          unzip -p "$file" DPA-CSV-Exporter/1.7/Assemblies/DPA.CsvExporter.dll > 1.7/Assemblies/DPA.CsvExporter.dll
          echo "b5b625a7668b2cdd0c1bfa2f978f2bdcb6b265e95a0bda159874fd7bc8401f06  1.7/Assemblies/DPA.CsvExporter.dll" | sha256sum -c -
          unzip -Z1 "$file" | grep -q 'DPA-CSV-Exporter/About/About.xml'
          ! unzip -Z1 "$file" | grep -E 'Assembly-CSharp.dll|UnityStubs.dll|Waylith.dll|0Harmony.dll|PerformanceAnalyzer.dll'
      - name: Commit compiled DLL and installation ZIP to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/DPA-CSV-Exporter-1.0.0-RW1.7.zip 1.7/Assemblies/DPA.CsvExporter.dll
          git rm .github/workflows/import-existing-build.yml
          git commit -m "Store verified DPA CSV Exporter build and installation ZIP"
          git push origin HEAD:main
