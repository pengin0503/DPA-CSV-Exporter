name: Build and update DPA CSV Exporter ZIP (no R2)
on:
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'About/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/pr-checks.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dpa-csv-dist-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run CSV tests and compile against public RimRef metadata
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project Tests/CsvSmokeTest.csproj -c Release
          dotnet build Source/DPA.CsvExporter.csproj -c Release --nologo
          test -s 1.7/Assemblies/DPA.CsvExporter.dll
      - name: Package only own DLL + About.xml + README
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          stage="$RUNNER_TEMP/dpa-release/DPA-CSV-Exporter"
          mkdir -p "$stage/About" "$stage/1.7/Assemblies"
          cp About/About.xml "$stage/About/"
          cp 1.7/Assemblies/DPA.CsvExporter.dll "$stage/1.7/Assemblies/"
          cp README.md "$stage/"
          ( cd "$RUNNER_TEMP/dpa-release" && zip -q -r "$GITHUB_WORKSPACE/dist/DPA-CSV-Exporter-1.0.1-RW1.7.zip" DPA-CSV-Exporter )
          unzip -t dist/DPA-CSV-Exporter-1.0.1-RW1.7.zip
          ! unzip -Z1 dist/DPA-CSV-Exporter-1.0.1-RW1.7.zip | grep -E 'Assembly-CSharp\.dll|UnityStubs\.dll|Waylith\.dll|0Harmony\.dll|PerformanceAnalyzer\.dll'
          unzip -p dist/DPA-CSV-Exporter-1.0.1-RW1.7.zip DPA-CSV-Exporter/1.7/Assemblies/DPA.CsvExporter.dll | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/zip-dll.sha"
          sha256sum 1.7/Assemblies/DPA.CsvExporter.dll | cut -d' ' -f1 > "$RUNNER_TEMP/built-dll.sha"
          diff "$RUNNER_TEMP/zip-dll.sha" "$RUNNER_TEMP/built-dll.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: DPA-CSV-Exporter-1.0.1-RW1.7
          path: dist/DPA-CSV-Exporter-1.0.1-RW1.7.zip
          if-no-files-found: error
          retention-days: 30
      - name: Commit verified DLL and ZIP to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch dist/DPA-CSV-Exporter-1.0.0-RW1.7.zip
          git add 1.7/Assemblies/DPA.CsvExporter.dll dist/DPA-CSV-Exporter-1.0.1-RW1.7.zip
          if git diff --cached --quiet; then
            echo "DLL and ZIP already match the new build."
          else
            git commit -m "build: publish verified DPA CSV Exporter 1.0.1"
            git push origin HEAD:main
          fi
