name: PR checks - DPA CSV Exporter
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: CSV, GUI and exporter regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project Tests/CsvSmokeTest.csproj -c Release
      - run: dotnet run --project Tests/Gui/GuiRegression.csproj -c Release
      - run: dotnet run --project Tests/Exporter/ExporterRegression.csproj -c Release
  compile:
    name: Build addon against public RimRef signatures (no R2)
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile and verify DLL
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Source/DPA.CsvExporter.csproj -c Release --nologo
          test -s 1.7/Assemblies/DPA.CsvExporter.dll
      - name: Package and verify self-authored code only
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/release/DPA-CSV-Exporter"
          mkdir -p "$stage/About" "$stage/1.7/Assemblies"
          cp About/About.xml "$stage/About/"
          cp 1.7/Assemblies/DPA.CsvExporter.dll "$stage/1.7/Assemblies/"
          cp README.md "$stage/"
          ( cd "$RUNNER_TEMP/release" && zip -q -r "$GITHUB_WORKSPACE/DPA-CSV-Exporter-1.0.3-RW1.7.zip" DPA-CSV-Exporter )
          unzip -t DPA-CSV-Exporter-1.0.3-RW1.7.zip
          ! unzip -Z1 DPA-CSV-Exporter-1.0.3-RW1.7.zip | grep -E 'Assembly-CSharp\.dll|UnityStubs\.dll|Waylith\.dll|0Harmony\.dll|PerformanceAnalyzer\.dll'
          unzip -p DPA-CSV-Exporter-1.0.3-RW1.7.zip DPA-CSV-Exporter/1.7/Assemblies/DPA.CsvExporter.dll | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/zip-dll.sha"
          sha256sum 1.7/Assemblies/DPA.CsvExporter.dll | cut -d' ' -f1 > "$RUNNER_TEMP/built-dll.sha"
          diff "$RUNNER_TEMP/zip-dll.sha" "$RUNNER_TEMP/built-dll.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: DPA-CSV-Exporter-1.0.3-PR
          path: DPA-CSV-Exporter-1.0.3-RW1.7.zip
          if-no-files-found: error
          retention-days: 14
